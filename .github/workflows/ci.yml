name: CI

on:
  push:
  pull_request:

jobs:
  desktop:
    name: Desktop checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.77.2
          components: rustfmt

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build Tauri WebView assets
        run: npm run build

      - name: Check repository hygiene
        run: npm run validate:repo-files

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Check Rust crate
        working-directory: src-tauri
        run: cargo check --locked
